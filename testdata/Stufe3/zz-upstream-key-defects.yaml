# =============================================================================
# Aliases working around undefined ${data.*} keys in the upstream feature files
# =============================================================================
# NOT an upstream file. The six files beside this one are byte-identical copies
# of gematik/isik-testsuite 2.7.0 testdata/Stufe3/ (verify with
# `sha256sum` against the release tarball; the checksums are in
# run/tiger/RENDERED.txt). This file is ours, and it exists because the upstream
# feature files reference keys that upstream's own testdata does not define.
#
# Loaded LAST in additionalConfigurationFiles, under the same `baseKey: data`, so
# these entries are additive: they define keys that would otherwise be absent and
# never override an upstream value. The `zz-` prefix keeps that ordering visible
# in a directory listing.
#
# Why work around it at all rather than let the scenarios fail: an undefined key
# resolves to the literal string "${data.practitioner-id}" in the rendered step.
# That produces a failure whose cause is a defect in the test suite, but whose
# appearance is indistinguishable from a defect in the SUT - exactly the confusion
# the gap analysis exists to prevent. Each entry below is recorded in
# docs/en/05-testdata.md as an upstream test-suite defect, and none of them is
# counted as an IRIS gap.
#
# No entry here invents a resource: every key that names an instance points at
# an instance the upstream keys already require, so no additional test data is
# needed. Two kinds of entry appear:
#
#   (a) an alias for a key an upstream feature file references but upstream's
#       own testdata leaves undefined (practitioner-id, below);
#   (b) a value the Stufe 3 contract leaves undefined although the Stufe 3
#       profiles require the corresponding element to be present in a body that
#       both levels share (atc-code-version, below). Without it the shared body
#       would have to carry a literal, and the two levels would silently drift.
# =============================================================================

# Stufe3/Basis/Practitioner-Search.feature:53
#   Scenario "Suche der Practitioner-Ressource anhand des Vornamens (Negativtest)"
#   Feature tags: @Stufe3 @Basismodul @Mandatory  -> IN the default run scope.
#
#   The FHIRPath expression on that line correctly uses
#   ${data.practitioner-read-id}; only the accompanying error message text uses
#   ${data.practitioner-id}. The assertion therefore evaluates correctly either
#   way and the scenario's PASS/FAIL verdict is unaffected - the sole consequence
#   of leaving this undefined is an unresolved placeholder in the message shown
#   when the negative test fails. Defined anyway so that no failure message in the
#   official report contains a literal "${data....}" string, which an inspector
#   would reasonably read as a broken harness.
practitioner-id: Practitioner-Read-Example

# ISiKATCCoding fixes Coding.system to http://fhir.de/CodeSystem/bfarm/atc and
# requires Coding.version (min 1). The Stufe 5 contract defines
# `atc-code-version` (medikation.yaml) and its Stufe 5 feature files reference
# it; the Stufe 3 contract defines no equivalent, although ISiKATCCoding is
# profiled identically for Stufe 3 and the Stufe 3 bodies already carry the
# value as a literal. 2021 is the ATC release the Stufe 3 bodies were authored
# against, and it is the literal present in
# Stufe3/Medication-Medication-Read-Extended-Example.json and
# Stufe3/MedicationRequest-MedicationRequest-Read-Extended-Example.json. No
# Stufe 3 assertion reads the value; only its presence is validated.
atc-code-version: "2021"
